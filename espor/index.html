<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trakya Üniversitesi Espor Topluluğu</title>
    <!-- İkonlar için FontAwesome kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Modern Espor Fontu -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at top, #1b2238 0%, #0b0e17 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 36px 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .logo-box {
            width: 96px;
            height: 96px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            padding: 3px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #0b0e17;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.25s ease;
        }

        .link-btn i {
            font-size: 20px;
        }

        /* Platformlara Özel Hover Renkleri */
        .link-btn.whatsapp:hover {
            background: #25D366;
            border-color: #25D366;
            color: #0b0e17;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
        }

        .link-btn.instagram:hover {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(220, 39, 67, 0.35);
        }

        .link-btn.discord:hover {
            background: #5865F2;
            border-color: #5865F2;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
        }

        .link-btn.form:hover {
            background: #00f0ff;
            border-color: #00f0ff;
            color: #0b0e17;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 240, 255, 0.35);
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO KISMI: logo.png dosyasını aynı klasöre atarsan otomatik görünür -->
        <div class="logo-box">
            <img src="logo.png" alt="Topluluk Logosu" onerror="this.src='https://via.placeholder.com/150/0b0e17/00f0ff?text=ESPOR'">
        </div>

        <h1>Trakya Üniversitesi<br>Espor Topluluğu</h1>
        <p class="subtitle">Turnuvalar, duyurular ve topluluk kanallarımız</p>

        <div class="links">
            <!-- WHATSAPP LİNKİ -->
            <a href="https://chat.whatsapp.com/FkUMAQtwo8K8IsO2MlVmdx" target="_blank" class="link-btn whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
                <span>WhatsApp Duyuru Grubu</span>
            </a>

            <!-- INSTAGRAM LİNKİ -->
            <a href="https://www.instagram.com/tuespor22?utm_source=ig_web_button_share_sheet&mdxt=ZDNlZDc0MzIxNw==https://instagram.com/KULLANICI_ADINIZ" target="_blank" class="link-btn instagram">
                <i class="fa-brands fa-instagram"></i>
                <span>Instagram Hesabımız</span>
            </a>

            <!-- DISCORD LİNKİ (İstemezsen bu bloğu silebilirsin) -->
            <a href="https://discord.gg/BURAYA_DAVET_KODU" target="_blank" class="link-btn discord">
                <i class="fa-brands fa-discord"></i>
                <span>Discord Sunucumuz</span>
            </a>

            <!-- TURNUVA / ÜYELİK FORMU LİNKİ -->
            <a href="https://forms.gle/BURAYA_FORM_LINKI" target="_blank" class="link-btn form">
                <i class="fa-solid fa-trophy"></i>
                <span>Turnuva & Üyelik Başvurusu</span>
            </a>
        </div>

        <div class="footer">
            © 2026 Trakya Üniversitesi Espor Topluluğu
        </div>
    </div>

</body>
</html>
